# PayFlex / Gift — Frontend (React) + Backend (Laravel)
# Frontend host port defaults to 8080 (80 is often used by the panel). Set FRONTEND_PORT=80 in .env if needed.
# Backend: host port BACKEND_PORT (default 8000). Set APP_URL / FRONTEND_URL in .env for domains.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gift-backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-PayFlex}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-laravel}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    volumes:
      - backend_storage:/var/www/storage
      - backend_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',8000)?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API is proxied by nginx to backend; use relative URL so same origin
        VITE_API_URL: "/api/v1"
    container_name: gift-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: gift-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      # MySQL image forbids MYSQL_USER=root; create app user "laravel" only
      MYSQL_USER: laravel
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: gift-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  backend_storage:
  backend_bootstrap_cache:
  mysql_data:
  redis_data:
